[project]
name = "urdu-nlp-toolkit"
version = "0.1.0"
description = "Urdu and Roman Urdu text processing: normalisation, tokenisation, transliteration, stopwords. Pure Python, no dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["urdu", "roman-urdu", "nlp", "transliteration", "normalization", "pakistan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Urdu",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
# No dependencies. Deliberate: this is the layer everything else sits on, and a
# dependency here becomes a dependency of every Urdu project that uses it.
dependencies = []

[project.urls]
Homepage = "https://github.com/hammasbuilds/urdu-nlp-toolkit"
Issues = "https://github.com/hammasbuilds/urdu-nlp-toolkit/issues"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urdunlp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
